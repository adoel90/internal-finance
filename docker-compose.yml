services:

  postgres:
    image: postgres:16-alpine
    container_name: nf_finance_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: medusa
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U medusa -d medusa"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - medusa_network


  redis:
    image: redis:7.2-alpine
    container_name: nf_finance_redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - medusa_network


  medusa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nf_finance_medusa
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "9000:9000"

    env_file:
      - .env

    volumes:
      - .:/server
      - /server/node_modules

    networks:
      - medusa_network


volumes:
  postgres_data:
  redis_data:


networks:
  medusa_network:
    driver: bridge